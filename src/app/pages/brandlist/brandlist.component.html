<section class="product_section">

  <div class="container">

    <div class="row">
      <div class="col-lg-12 col-12 text-center py-3">
        <h1 class="section-title">Explore Our Range of Brands</h1>

        <p class="section-para">
          Explore our selection of original spare parts, sourced from leading brands to ensure optimal performance and
          durability for your machinery</p>
      </div>
    </div>



    <div class="row">
    @defer (when !isLoading) {
  @for (item of brandList; track $index) {
    <div class="col-lg-3 col-md-4 col-sm-6 col-6 my-4">
      <div
        class="card card-body brand-card"
        [routerLink]="['/productss', item.category_name]"
      >
        <img [src]="item.image" class="brandimage" alt="" />
      </div>
    </div>
  }
} @placeholder {
  <!-- Shown immediately while waiting -->
  <div class="col-12 text-center my-5">
    <app-loader></app-loader>
  </div>
} @loading (minimum 500ms) {
  <!-- Shown if loading takes a bit -->
  <div class="col-12 text-center my-5">
    <app-loader></app-loader>
  </div>
}



    </div>

   </div>

</section>
