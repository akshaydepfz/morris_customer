<div class="row">
  <div class="col-lg-12">
    <div class="card">
      <div class="card-body px-0 pb-0">
        <div class="d-flex justify-content-between px-3 align-items-center">
          <h5 class="card-title">Sub Categories</h5>

          <button type="button" class="btn save-btn mb-3 float-end" (click)="showModal()" data-bs-toggle="modal" data-bs-target="#exampleModal">
            Add  <i class="bi bi-plus-lg"></i>
          </button>

        </div>

        <div class="table-responsive category_table">
          <table class="table table-bordered mb-0">
            <thead class="thead-bg">
              <tr class="thead-bg">
                <th scope="col" style="width: 10px;">Action</th>
                <th scope="col" style="width: 200px;">Subcategory</th>
                <th scope="col"style="width: 200px;">Category</th>
                <th scope="col"style="width: 100px;">Image</th>

              </tr>
            </thead>
            <tbody>

              <ng-container *ngIf="isLoading; else dataRows">
                <tr *ngFor="let _ of [].constructor(4)">
                  <td><div class="shimmer shimmer-cell"></div></td>
                  <td><div class="shimmer shimmer-cell"></div></td>
                  <td><div class="shimmer shimmer-cell"></div></td>
                  <td><div class="shimmer shimmer-cell" style="width: 100%; height: 40px;"></div></td>

                </tr>
              </ng-container>
              <ng-template #dataRows>
                @for(item of subCategories| paginate: { itemsPerPage: 50, currentPage: currentPage }; track $index) {
                  <tr>
                    <th scope="row"><i class="bi bi-trash3 btn btn-danger" (click)="deleteCategories(item.id)"></i></th>
                    <td>{{item.Sub_category_name}}</td>
                    <td>{{item.category_name}}</td>
                    <td><img src="{{item.image}}" class="cat-img" width="100%" height="100%" alt=""></td>

                  </tr>
                }
              </ng-template>




            </tbody>
          </table>
          <div class="pagination-controls">
            <pagination-controls (pageChange)="currentPage = $event"></pagination-controls>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>



<div class="modal fade add_product-modal" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h1 class="modal-title fs-5" id="exampleModalLabel">Sub Category</h1>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <form (ngSubmit)="addSubCateogories()">
      <div class="modal-body">
        <div class="row">
          <div class="mb-3 col-lg-6 col-md-6 col-12">
            <label for="categories" class="form-label">Select Category</label>
           <select name="categoryName" class="form-select" id="categories" [(ngModel)]="categoryName">
            <option value="" selected disabled>select category</option>
            @for (item of cateogories; track $index) {

              <option value="{{item.category_name}}" class="option">{{item.category_name}}</option>
            }
           </select>
          </div>

          <div class="mb-3 col-lg-6 col-md-6 col-12">
            <label for="subcategory_name" class="form-label">Sub Category Name</label>
            <input type="text" class="form-control" id="subcategory_name"  [(ngModel)]="subCategoryName"
            name="subCategoryName">
          </div>

          <div class="mb-3 col-lg-12 col-md-12 col-12">
            <label for="image" class="form-label">Image</label>
            <input
                type="file"
                class="form-control"
                (change)="onFileSelected($event)"
                id="image"  #imageInput
                required
              />
          </div>

        </div>

        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
          <button type="submit" class="btn save-btn" data-bs-dismiss="modal">Add</button>
        </div>
      </form>
    </div>
  </div>
</div>
