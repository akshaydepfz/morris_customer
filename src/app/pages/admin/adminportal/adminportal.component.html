<div class="container-fluid">
  <div class="row">
    <div class="col-lg-12 col-12 ">
      <div class="card">
        <div class="card-body px-0 pb-0">
          <div class="d-flex justify-content-between px-3 align-items-center">
            <h5 class="card-title">Products</h5>
            <button type="button" class="btn save-btn mb-3 float-end" data-bs-toggle="modal" data-bs-target="#exampleModal">
              Add <i class="bi bi-plus-lg"></i>
            </button>

          </div>
          <ag-grid-angular style="width: 100%; height: calc(100vh - 200px)" [rowData]="rowData" [pagination]="pagination"
            [paginationPageSize]="paginationPageSize" (gridReady)="onGridReady($event)"
            [paginationPageSizeSelector]="paginationPageSizeSelector" [columnDefs]="colDefs" />
        </div>
      </div>
    </div>
  </div>
</div>




<div class="modal fade add_product-modal" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h1 class="modal-title fs-5" id="exampleModalLabel">Modal title</h1>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form class="row">
          <div class="mb-3 col-lg-6 col-md-6 col-12">
            <label for="part" class="form-label">part Number</label>
            <input type="text" class="form-control" placeholder="Part Number" id="part">
          </div>
          <div class="mb-3 col-lg-6 col-md-6 col-12">
            <label for="" class="form-label">Remain Part Number</label>
            <input type="text" class="form-control" id="" >
          </div>

          <div class="mb-3 col-lg-6 col-md-6 col-12">
            <label for="partDescription" class="form-label">Part Description</label>
            <input type="text" class="form-control" id="partDescription">
          </div>

          <div class="mb-3 col-lg-6 col-md-6 col-12">
            <label for="fg_wison_part_number" class="form-label">fg_wison_part_number</label>
            <input type="text" class="form-control" id="fg_wison_part_number">
          </div>

          <div class="mb-3 col-lg-6 col-md-6 col-12">
            <label for="super_ss_number" class="form-label">super_ss_number</label>
            <input type="text" class="form-control" id="fg_wison_part_number">
          </div>

          <div class="mb-3 col-lg-6 col-md-6 col-12">
            <label for="weight" class="form-label">weight</label>
            <input type="text" class="form-control" id="weight">
          </div>

          <div class="mb-3 col-lg-6 col-md-6 col-12">
            <label for="coo" class="form-label">Coo</label>
            <input type="text" class="form-control" id="coo">
          </div>


          <div class="mb-3 col-lg-6 col-md-6 col-12">
            <label for="hsCode" class="form-label">Hs code</label>
            <input type="text" class="form-control" id="hsCode">
          </div>

          <div class="mb-3 col-lg-6 col-md-6 col-12">
            <label for="hs_code" class="form-label">Image</label>
            <input type="file" class="form-control" id="image">
          </div>

          <div class="mb-3 col-lg-6 col-md-6 col-12">
            <label for="subCategory" class="form-label">sub Category</label>
            <input type="text" class="form-control" id="subCategory">
          </div>

        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        <button type="button" class="btn save-btn ">Add</button>
      </div>
    </div>
  </div>
</div>
